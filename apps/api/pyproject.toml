[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impeccable-api"
version = "1.0.0"
description = "FastAPI Intelligence Layer for ImpeccableOS Adaptive AI Engineering Trainer"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sourabh", email = "sourabhsk0007@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: FastAPI"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py312"
